<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>For My Love 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html {
  scroll-behavior:smooth;
}

body{
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#ffd6e7,#ffeef5,#f8dfff);
  color:#4a90ff;
  overflow-x:hidden;
  opacity:0;
  animation:fadeIn 1.5s ease forwards;
}

@keyframes fadeIn{
  to{opacity:1;}
}

/* ✨ FLOATING BACKGROUND PARTICLES */
.particles{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
}

.spark{
  position:absolute;
  width:6px;
  height:6px;
  background:white;
  border-radius:50%;
  opacity:0.6;
  animation:rise 10s linear infinite;
}

@keyframes rise{
  0%{transform:translateY(0) scale(1);opacity:0;}
  10%{opacity:1;}
  100%{transform:translateY(-120vh) scale(0.5);opacity:0;}
}

/* 💖 HEARTS */
.hearts{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:1;
}

.heart{
  position:absolute;
  bottom:-20px;
  animation:float 8s linear infinite;
  font-size:18px;
  opacity:0.7;
}

@keyframes float{
  0%{transform:translateY(0) rotate(0deg);opacity:0;}
  10%{opacity:1;}
  100%{transform:translateY(-120vh) rotate(360deg);opacity:0;}
}

.container{
  position:relative;
  z-index:2;
  padding:30px;
  text-align:center;
}

.hero{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

h1{
  font-family:'Dancing Script',cursive;
  font-size:4rem;
  text-shadow:0 5px 25px rgba(0,0,0,0.25);
}

.subtitle{
  max-width:600px;
  color:white;
  margin-top:15px;
  line-height:1.7;
}

.btn{
  margin-top:20px;
  padding:14px 28px;
  background:white;
  border:none;
  border-radius:50px;
  color:#ff5c8a;
  font-weight:600;
  cursor:pointer;
  transition:0.3s;
}

.btn:hover{
  transform:scale(1.08);
}

/* 🌸 SECTIONS */
.section{
  margin-top:90px;
}

.section-title{
  font-family:'Dancing Script',cursive;
  font-size:2.4rem;
  margin-bottom:25px;
}

/* 💙 GALLERY */
.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  max-width:1000px;
  margin:auto;
}

/* 💎 CARD WITH BREATHING GLOW */
.photo{
  position:relative;
  padding:10px;
  border-radius:25px;
  background:rgba(255,255,255,0.2);
  backdrop-filter:blur(10px);

  opacity:0;
  transform:translateY(60px) scale(0.95);
  transition:all 1s cubic-bezier(0.25, 1, 0.5, 1);
}

/* 💙 magical breathing glow */
.photo::before{
  content:"";
  position:absolute;
  inset:-25px;
  border-radius:40px;
  background:radial-gradient(circle,
    rgba(0,150,255,0.9),
    rgba(0,200,255,0.4),
    transparent 70%
  );
  filter:blur(28px);
  opacity:0;
  z-index:-1;
  animation:glowPulse 3.5s ease-in-out infinite;
}

@keyframes glowPulse{
  0%,100%{transform:scale(1);opacity:0.6;}
  50%{transform:scale(1.08);opacity:1;}
}

.photo.show{
  opacity:1;
  transform:translateY(0) scale(1);
}

.photo:hover{
  transform:translateY(-8px) scale(1.03);
}

.photo img{
  width:100%;
  height:300px;
  object-fit:cover;
  border-radius:20px;
  display:block;
}

/* 💌 NOTES */
.note-box{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  max-width:800px;
  margin:auto;
}

.note{
  background:rgba(255,255,255,0.18);
  padding:25px;
  border-radius:25px;
  backdrop-filter:blur(10px);
}

/* 🎥 VIDEO */
iframe{
  width:90%;
  max-width:700px;
  height:400px;
  border:none;
  border-radius:25px;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

/* ⏳ TIMER */
.counter{
  font-size:1.5rem;
  margin-top:20px;
}

/* 📱 MOBILE */
@media(max-width:600px){
  h1{font-size:3rem;}
  iframe{height:250px;}
}
</style>
</head>

<body>

<div class="particles"></div>
<div class="hearts"></div>

<div class="container">

<section class="hero">
  <h1>To My Babyy💖</h1>
  <p class="subtitle">Every moment with you feels like a dream I never want to wake up from 🫶</p>
  <a href="#gallery" class="btn">Open Memories ✨</a>
</section>

<section class="section" id="gallery">
  <h2 class="section-title">Our Memories 📸</h2>

  <div class="gallery">
    <div class="photo"><img src="image1.jpg"></div>
    <div class="photo"><img src="image2.jpg"></div>
    <div class="photo"><img src="image3.jpg"></div>
  </div>
</section>

<section class="section">
  <h2 class="section-title">Love Notes 💌</h2>

  <div class="note-box">
    <div class="note">Your smile fixes everything.</div>
    <div class="note">I miss you even when you're near.</div>
    <div class="note">You're my safest place 🫶</div>
  </div>
</section>

<section class="section">
  <h2 class="section-title">Video 🎥</h2>

  <iframe src="https://www.youtube.com/embed/AoCNZarU0hQ" allowfullscreen></iframe>
</section>

<section class="section">
  <h2 class="section-title">Time With You ⏳</h2>
  <div class="counter" id="counter"></div>
</section>

</div>

<script>

/* 💖 HEARTS */
function createHeart(){
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML="💖";
  h.style.left=Math.random()*100+"vw";
  h.style.fontSize=(15+Math.random()*20)+"px";
  h.style.animationDuration=(5+Math.random()*5)+"s";
  document.querySelector(".hearts").appendChild(h);
  setTimeout(()=>h.remove(),10000);
}
setInterval(createHeart,250);

/* ✨ SPARK PARTICLES */
function createSpark(){
  const s=document.createElement("div");
  s.className="spark";
  s.style.left=Math.random()*100+"vw";
  s.style.top="100vh";
  s.style.animationDuration=(6+Math.random()*5)+"s";
  document.querySelector(".particles").appendChild(s);
  setTimeout(()=>s.remove(),11000);
}
setInterval(createSpark,400);

/* ⏳ TIMER */
const start=new Date("2026-01-09T00:00:00");
function update(){
  const d=new Date()-start;
  document.getElementById("counter").innerHTML=
  Math.floor(d/86400000)+" days 💖";
}
setInterval(update,1000);
update();

/* ✨ SCROLL ANIMATION */
const obs=new IntersectionObserver(e=>{
  e.forEach(x=>{
    if(x.isIntersecting){
      x.target.classList.add("show");
    }
  });
},{threshold:0.2});

document.querySelectorAll(".photo").forEach(p=>obs.observe(p));

</script>

</body>
</html>
